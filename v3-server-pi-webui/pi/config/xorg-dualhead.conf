# Installed as /etc/X11/xorg.conf.d/10-dualhead.conf
#
# ONE X screen spanning BOTH HDMI outputs side by side, rather than the
# classic "Zaphod mode" pair of independent screens (:0.0 / :0.1).
#
# WHY NOT ZAPHOD: on a Raspberry Pi 4 running vc4-kms-v3d, the modesetting
# driver will not split the single DRM device into two X screens. Two Device
# sections sharing one non-PCI (platform) device either abort the server with
#
#     (EE) Cannot run in framebuffer mode. Please specify busIDs
#          for all framebuffer devices
#
# or are silently collapsed into one screen with both outputs mirrored at
# +0+0. Adding BusID "platform:gpu" does not help — that bus ID form applies
# to PCI devices. Verified on a Pi 4 Model B (Debian 13, vc4-kms-v3d,
# Xorg modesetting): every ZaphodHeads variant failed, so ~/.xinitrc now
# places one mpv per output on this single screen instead.
#
# NO kmsdev OPTION: do not pin this to a card number. A Pi 4 exposes two DRM
# devices and v3d frequently enumerates FIRST:
#
#     card0  driver=v3d       <- render only, owns NO connectors
#     card1  driver=vc4-drm   <- owns the HDMI connectors
#
# Pointing kmsdev at card0 makes Xorg fail with "(EE) No devices detected" /
# "no screens found". Under autologin that failure is silent and
# self-perpetuating: startx dies in ~350ms, the login shell exits, agetty
# respawns it, and after 5 rounds systemd gives up with "start-limit-hit",
# leaving both screens black. Omitting kmsdev entirely lets Xorg's platform
# probe find the right device on its own — it correctly prefers the node that
# actually has connectors.
#
# The Virtual size below must be large enough to hold both outputs side by
# side, because ~/.xinitrc positions the second one to the right of the first
# with xrandr, and an output cannot be placed outside the framebuffer. Two 4K
# panels need 3840*2 x 2160. Raise this if you ever attach larger displays;
# the vc4 driver on a Pi 4 reports a 7680x7680 maximum.

Section "ServerFlags"
    Option "Xinerama" "off"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Device"
    Identifier "VideoWallGPU"
    Driver "modesetting"
EndSection

Section "Monitor"
    Identifier "MonitorWall"
EndSection

Section "Screen"
    Identifier "ScreenWall"
    Device "VideoWallGPU"
    Monitor "MonitorWall"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 7680 2160
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "VideoWallLayout"
    Screen 0 "ScreenWall"
EndSection
