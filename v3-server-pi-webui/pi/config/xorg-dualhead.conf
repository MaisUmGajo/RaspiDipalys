# Installed as /etc/X11/xorg.conf.d/10-dualhead.conf
#
# Classic "Zaphod mode": two independent X screens on one X server, each
# pinned to one physical HDMI connector. No Xinerama, no window manager
# needed — each screen has exactly one client (mpv) and is inherently
# fullscreen on it.
#
# IMPORTANT: "HDMI-1" / "HDMI-2" below are placeholders. The actual DRM
# connector names depend on the kernel/driver version and can be
# "HDMI-1"/"HDMI-2" or "HDMI-A-1"/"HDMI-A-2". Before relying on this file,
# boot to the console, run `startx` once with a trivial ~/.xinitrc (e.g.
# just `xterm`), then run `DISPLAY=:0 xrandr` from another tty and update
# the two "ZaphodHeads" lines below to match what you see. Get this wrong
# and one screen will simply stay blank/unused.
#
# HDMI0 (the port nearest the USB-C power input) drives the 4K output;
# HDMI1 drives the 1080p output.

Section "ServerFlags"
    Option "Xinerama" "off"
EndSection

Section "Device"
    Identifier "Device4K"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "ZaphodHeads" "HDMI-1"
EndSection

Section "Device"
    Identifier "Device1080p"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "ZaphodHeads" "HDMI-2"
EndSection

Section "Monitor"
    Identifier "Monitor4K"
EndSection

Section "Monitor"
    Identifier "Monitor1080p"
EndSection

Section "Screen"
    Identifier "Screen4K"
    Device "Device4K"
    Monitor "Monitor4K"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "3840x2160"
    EndSubSection
EndSection

Section "Screen"
    Identifier "Screen1080p"
    Device "Device1080p"
    Monitor "Monitor1080p"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "VideoWallLayout"
    Screen 0 "Screen4K"
    Screen 1 "Screen1080p" RightOf "Screen4K"
EndSection
