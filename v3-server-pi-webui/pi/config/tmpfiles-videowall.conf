# Installed as /etc/tmpfiles.d/videowall.conf
#
# Runtime directory shared by the display session and the web UI. The display
# session (user videowall) writes the mpv IPC sockets and the watchdog's
# health file here; the web UI (user videowall-web) reads the health file.
# /run is not writable by either account, so systemd-tmpfiles creates this on
# every boot with the right owner.
d /run/videowall 0755 videowall videowall -
